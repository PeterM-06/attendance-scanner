<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ماسح الحضور</title>
<style>
body{margin:0;background:#0f172a;color:#fff;font-family:Arial,sans-serif;text-align:center;padding:18px}
.wrap{max-width:560px;margin:auto}
.card{background:#1e293b;padding:18px;border-radius:16px}
#reader{max-width:500px;margin:auto}
#result{margin-top:16px;padding:15px;border-radius:10px;background:#172033;min-height:50px;font-size:20px}
.success{background:#064e3b!important;color:#6ee7b7}
.error{background:#450a0a!important;color:#fca5a5}
.warn{background:#451a03!important;color:#fcd34d}
.info{color:#94a3b8;margin-top:12px}
button{padding:10px 18px;border:0;border-radius:8px;margin:8px;background:#2563eb;color:white}
</style>
<script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
<div class="wrap">
<h1>📷 ماسح الحضور</h1>
<div class="card">
<div id="reader"></div>
<div id="result">في انتظار QR...</div>
<div class="info">امسح أكواد الطلاب واحدًا وراء الآخر.</div>
<button onclick="testConnection()">🔧 اختبار الاتصال</button>
<div id="diag" style="text-align:right;font-size:13px;color:#94a3b8;margin-top:8px;white-space:pre-wrap;word-break:break-all"></div>
</div>
</div>
<script>
const WEB_APP_URL="https://script.google.com/macros/s/AKfycbxchjrSC4Wl5-Q1noYdEdXr3L0yPS0HkD56mSo-i2aW5YOHWk-mxT3aZdJYcs_Uf_zRGA/exec";
/* لازم يكون نفس القيمة بالظبط الموجودة في Code.gs (SCAN_TOKEN) */
const SCAN_TOKEN="JAWALA-2026-CHANGE-ME-7f3a9";
let processing=false,lastId="",lastTime=0;

function beep(type){
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    const ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();
    o.frequency.value=type==="success"?880:type==="warn"?440:220;
    o.connect(g);g.connect(ctx.destination);g.gain.value=.08;
    o.start();o.stop(ctx.currentTime+(type==="success"?.12:.22));
  }catch(e){}
}
function vibrate(ms){if(navigator.vibrate) navigator.vibrate(ms);}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function show(t,c){const b=document.getElementById("result");b.className=c||"";b.innerHTML=t;}

/* =========================
   اختبار الاتصال (تشخيص)
   بيستخدم fetch عشان نقدر نشوف
   الخطأ الحقيقي على الشاشة من غير
   ما نفتح Developer Tools
========================= */

async function testConnection(){
  const diag = document.getElementById("diag");
  diag.textContent = "⏳ جاري الاختبار...";

  const testUrl = WEB_APP_URL + "?action=scan&barcode=DIAG_TEST&scannedBy=DiagTool&token=" + encodeURIComponent(SCAN_TOKEN) + "&callback=diagCb";

  try{
    const res = await fetch(testUrl, {method:"GET"});
    const text = await res.text();

    diag.textContent =
      "✅ وصل رد من السيرفر\n" +
      "HTTP Status: " + res.status + "\n" +
      "الرد: " + text.substring(0,300);

  }catch(err){

    diag.textContent =
      "❌ فشل الطلب فعليًا (مش وصل للسيرفر خالص)\n" +
      "تفاصيل الخطأ: " + (err && err.message ? err.message : String(err)) + "\n\n" +
      "الرابط اللي بيتحاول الاتصال بيه:\n" + testUrl + "\n\n" +
      "لو الخطأ فيه كلمة CORS: المشكلة في إعدادات الديبلوي.\n" +
      "لو الخطأ 'Failed to fetch': يا إما مفيش نت، يا إما الرابط غلط.";
  }
}

function sendScan(id){
  const cb="cb_"+Date.now();
  let settled=false;

  window[cb]=function(data){
    settled=true;
    if(data.status==="success"){
      beep("success");vibrate([100,60,100]);
      show("✅ تم تسجيل الحضور<br><b>"+esc(data.studentName||id)+"</b><br><small>"+esc(id)+"</small>","success");
    }else{
      const msg=data.message||"حدث خطأ";
      if(msg.includes("بالفعل")){
        beep("warn");vibrate(250);
        show("⚠️ الطالب مسجل بالفعل<br>"+esc(msg),"warn");
      }else{
        beep("error");vibrate(400);
        show("❌ "+esc(msg),"error");
      }
    }
    delete window[cb]; const s=document.getElementById(cb); if(s)s.remove();
    setTimeout(()=>{processing=false;show("📷 في انتظار QR...","");},1200);
  };

  const src = WEB_APP_URL+"?action=scan&barcode="+encodeURIComponent(id)+"&scannedBy="+encodeURIComponent("QR Scanner")+"&token="+encodeURIComponent(SCAN_TOKEN)+"&callback="+cb;

  const s=document.createElement("script");s.id=cb;s.src=src;

  s.onerror=function(){
    settled=true;
    processing=false;
    show("❌ فشل الاتصال بنظام الحضور<br><small>دوس زرار 'اختبار الاتصال' تحت عشان تعرف السبب</small>","error");
    delete window[cb]; s.remove();
  };

  document.body.appendChild(s);

  /* لو مفيش رد خالص (لا نجاح ولا فشل) خلال 15 ثانية */
  setTimeout(()=>{
    if(!settled){
      processing=false;
      show("⏱️ انتهت مهلة الاتصال (15 ثانية) من غير رد<br><small>تأكد من الإنترنت، أو دوس 'اختبار الاتصال'</small>","error");
      delete window[cb];
      if(s.parentNode) s.remove();
    }
  },15000);
}
function onScanSuccess(text){
  const id=String(text||"").trim(); if(!id||processing)return;
  const now=Date.now(); if(id===lastId&&now-lastTime<5000)return;
  lastId=id;lastTime=now;processing=true;
  show("🔎 تم العثور على QR<br><b>"+esc(id)+"</b><br><small>جاري التسجيل...</small>","");
  sendScan(id);
}
function onScanFailure(){}

new Html5QrcodeScanner("reader",{fps:10,qrbox:{width:250,height:250},rememberLastUsedCamera:true,supportedScanTypes:[Html5QrcodeScanType.SCAN_TYPE_CAMERA]},false).render(onScanSuccess,onScanFailure);
</script>
</body>
</html>
