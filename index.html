<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ماسح الحضور - جوالة</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b;
  --surface:#161618;
  --surface-2:#1f1f22;
  --line:#2c2c30;
  --gold:#d3a039;
  --gold-dim:#8a6c2b;
  --text:#f2f1ec;
  --text-muted:#8c8c92;
  --success-bg:#122a1c;
  --success-fg:#6fd99a;
  --warn-bg:#2e2410;
  --warn-fg:#f0c463;
  --error-bg:#2c1512;
  --error-fg:#f2a189;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  background-image:radial-gradient(circle at 50% 0%, #1a1a1d 0%, var(--bg) 60%);
  color:var(--text);
  font-family:'Inter',Tahoma,sans-serif;
  padding:22px 16px 40px;
}
.wrap{max-width:440px;margin:0 auto}

header{text-align:center;margin-bottom:18px}
.compass{width:34px;height:34px;margin:0 auto 8px;display:block}
h1{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:22px;
  letter-spacing:.5px;
  margin:0 0 4px;
}
.subtitle{color:var(--text-muted);font-size:13px;margin:0}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
}

.scan-frame{
  position:relative;
  border-radius:14px;
  overflow:hidden;
  background:#0d160f;
}
.scan-frame::before,.scan-frame::after,
.corner-tl,.corner-br{
  content:"";
  position:absolute;
  width:26px;height:26px;
  border:3px solid var(--gold);
  z-index:5;
  pointer-events:none;
}
.scan-frame::before{top:10px;left:10px;border-width:3px 0 0 3px;border-radius:6px 0 0 0}
.scan-frame::after{bottom:10px;right:10px;border-width:0 3px 3px 0;border-radius:0 0 6px 0}
.corner-tl{top:10px;right:10px;border-width:3px 3px 0 0;border-radius:0 6px 0 0}
.corner-br{bottom:10px;left:10px;border-width:0 0 3px 3px;border-radius:0 0 0 6px}
#reader{width:100%}

.badge{
  margin-top:16px;
  clip-path:polygon(50% 0%,100% 14%,100% 62%,50% 100%,0% 62%,0% 14%);
  background:var(--surface-2);
  color:var(--text-muted);
  min-height:120px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  padding:26px 20px 22px;
  text-align:center;
  transition:background .18s ease,color .18s ease;
}
.badge .icon{font-size:26px;line-height:1}
.badge .msg{font-size:15px;font-weight:500;color:var(--text)}
.badge .sub{font-size:12px;color:var(--text-muted)}
.badge.success{background:var(--success-bg)}
.badge.success .msg{color:var(--success-fg)}
.badge.warn{background:var(--warn-bg)}
.badge.warn .msg{color:var(--warn-fg)}
.badge.error{background:var(--error-bg)}
.badge.error .msg{color:var(--error-fg)}
.badge.pulse .icon{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.info{color:var(--text-muted);font-size:13px;text-align:center;margin-top:14px}

.log{margin-top:16px;display:flex;flex-direction:column;gap:6px}
.log-item{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--surface-2);
  border-right:3px solid var(--line);
  border-radius:8px;
  padding:8px 12px;
  font-size:13px;
}
.log-item.success{border-color:var(--success-fg)}
.log-item.warn{border-color:var(--warn-fg)}
.log-item.error{border-color:var(--error-fg)}
.log-item .name{color:var(--text)}
.log-item .time{color:var(--text-muted);font-size:11px}

@media(prefers-reduced-motion: reduce){
  .badge.pulse .icon{animation:none}
}
</style>
<script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
<div class="wrap">
<header>
<svg class="compass" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
<circle cx="20" cy="20" r="17" stroke="#d3a039" stroke-width="2"/>
<path d="M20 10L23 20L20 30L17 20Z" fill="#d3a039"/>
<circle cx="20" cy="20" r="2" fill="#0a0a0b"/>
</svg>
<h1>ماسح الحضور</h1>
<p class="subtitle">جوالة — تسجيل الحضور بالـ QR</p>
</header>

<div class="card">
<div class="scan-frame">
<div class="corner-tl"></div>
<div class="corner-br"></div>
<div id="reader"></div>
</div>

<div id="badge" class="badge">
<div class="icon">📷</div>
<div class="msg">جاهز للمسح</div>
<div class="sub">وجّه الكاميرا نحو كود الطالب</div>
</div>
</div>

<p class="info">امسح أكواد الطلاب واحدًا وراء الآخر</p>

<div id="log" class="log"></div>
</div>

<script>
const WEB_APP_URL="https://script.google.com/macros/s/AKfycbzWl3_NR3RM8avD_mstOOiLin4vCehKMQ_hxPbDluaSr11hk54XMUzLo4237kphs5GatA/exec";
const SCAN_TOKEN="JAWALA-2026-CHANGE-ME-7f3a9";
const SCAN_TIMEOUT_MS=12000;
const MAX_LOG=6;

let processing=false,lastId="",lastTime=0;

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}

function beep(type){
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    const ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();
    o.frequency.value=type==="success"?880:type==="warn"?440:220;
    o.connect(g);g.connect(ctx.destination);g.gain.value=.08;
    o.start();o.stop(ctx.currentTime+(type==="success"?.12:.22));
  }catch(e){}
}
function vibrate(ms){if(navigator.vibrate) navigator.vibrate(ms);}

function setBadge(state,icon,msg,sub,pulsing){
  const b=document.getElementById("badge");
  b.className="badge"+(state?" "+state:"")+(pulsing?" pulse":"");
  b.innerHTML="<div class=\"icon\">"+icon+"</div><div class=\"msg\">"+msg+"</div>"+(sub?"<div class=\"sub\">"+sub+"</div>":"");
}

function addLog(state,name,sub){
  const log=document.getElementById("log");
  const item=document.createElement("div");
  item.className="log-item "+state;
  const time=new Date().toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"});
  item.innerHTML="<span class=\"name\">"+esc(name)+(sub?" — "+esc(sub):"")+"</span><span class=\"time\">"+time+"</span>";
  log.insertBefore(item,log.firstChild);
  while(log.children.length>MAX_LOG) log.removeChild(log.lastChild);
}

function resetToIdle(){
  processing=false;
  setBadge("","📷","جاهز للمسح","وجّه الكاميرا نحو كود الطالب",false);
}

function sendScan(id){
  const cb="cb_"+Date.now()+"_"+Math.floor(Math.random()*1000);
  let settled=false;

  const timeoutId=setTimeout(function(){
    if(settled)return;
    settled=true;
    beep("error");vibrate(400);
    setBadge("error","⏱️","لا يوجد رد من السيرفر","تأكد من الاتصال بالإنترنت وحاول تاني",false);
    addLog("error",id,"لا يوجد رد (Timeout)");
    cleanup();
    setTimeout(resetToIdle,1500);
  },SCAN_TIMEOUT_MS);

  function cleanup(){
    delete window[cb];
    const s=document.getElementById(cb);
    if(s) s.remove();
  }

  window[cb]=function(data){
    if(settled)return;
    settled=true;
    clearTimeout(timeoutId);

    if(data.status==="success"){
      beep("success");vibrate([100,60,100]);
      const name=data.studentName||id;
      setBadge("success","✅","تم تسجيل الحضور",esc(name)+" — "+esc(id),false);
      addLog("success",name,id);
    }else{
      const msg=data.message||"حدث خطأ غير معروف";
      if(msg.includes("بالفعل")){
        beep("warn");vibrate(250);
        setBadge("warn","⚠️","الطالب مسجل بالفعل",esc(msg),false);
        addLog("warn",data.studentName||id,msg);
      }else{
        beep("error");vibrate(400);
        setBadge("error","❌",esc(msg),"",false);
        addLog("error",data.studentName||id,msg);
      }
    }
    cleanup();
    setTimeout(resetToIdle,1400);
  };

  const s=document.createElement("script");
  s.id=cb;
  s.src=WEB_APP_URL+"?action=scan&token="+encodeURIComponent(SCAN_TOKEN)+"&barcode="+encodeURIComponent(id)+"&scannedBy="+encodeURIComponent("QR Scanner")+"&callback="+cb;
  s.onerror=function(){
    if(settled)return;
    settled=true;
    clearTimeout(timeoutId);
    beep("error");vibrate(400);
    setBadge("error","❌","فشل الاتصال بنظام الحضور","تأكد إن رابط السيرفر صحيح ومتاح",false);
    addLog("error",id,"فشل الاتصال بالسيرفر");
    cleanup();
    setTimeout(resetToIdle,1500);
  };
  document.body.appendChild(s);
}

function onScanSuccess(text){
  const id=String(text||"").trim();
  if(!id||processing)return;
  const now=Date.now();
  if(id===lastId&&now-lastTime<5000)return;
  lastId=id;lastTime=now;processing=true;
  setBadge("","🔎","تم العثور على QR",id+" — جاري التسجيل...",true);
  sendScan(id);
}
function onScanFailure(){}

window.addEventListener("error",function(ev){
  setBadge("error","❌","حدث خطأ غير متوقع في الصفحة",esc(String(ev.message||"")),false);
});

try{
  new Html5QrcodeScanner(
    "reader",
    {fps:10,qrbox:{width:250,height:250},rememberLastUsedCamera:true,supportedScanTypes:[Html5QrcodeScanType.SCAN_TYPE_CAMERA]},
    false
  ).render(onScanSuccess,onScanFailure);
}catch(e){
  setBadge("error","❌","تعذّر تشغيل الكاميرا",esc(String(e.message||e)),false);
}
</script>
</body>
</html>
