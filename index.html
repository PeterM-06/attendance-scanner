<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ماسح الحضور</title>

  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 18px;
    }

    .wrap {
      max-width: 560px;
      margin: auto;
    }

    .card {
      background: #1e293b;
      padding: 18px;
      border-radius: 16px;
    }

    #reader {
      max-width: 500px;
      margin: auto;
    }

    #result {
      margin-top: 16px;
      padding: 15px;
      border-radius: 10px;
      background: #172033;
      min-height: 50px;
      font-size: 20px;
    }

    .success {
      background: #064e3b !important;
      color: #6ee7b7;
    }

    .error {
      background: #450a0a !important;
      color: #fca5a5;
    }

    .warn {
      background: #451a03 !important;
      color: #fcd34d;
    }

    .info {
      color: #94a3b8;
      margin-top: 12px;
    }

    button {
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      margin: 8px;
      background: #2563eb;
      color: white;
    }
  </style>

  <!-- مكتبة QR -->
  <script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body>

  <div class="wrap">

    <h1>📷 ماسح الحضور</h1>

    <div class="card">

      <div id="reader"></div>

      <div id="result">
        📷 في انتظار QR...
      </div>

      <div class="info">
        امسح أكواد الطلاب واحدًا وراء الآخر.
      </div>

    </div>

  </div>


  <script>

    /*************************************************
     * GOOGLE APPS SCRIPT WEB APP
     *************************************************/

    const WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbwkLfvwdnr8Sm1EL1ZXoQ0vvU8kI1rIrgxJcgGlaStcEzfiL6jtGsxPhGYlY6EyDh2kqA/exec";


    /*************************************************
     * SCAN TOKEN
     *
     * لازم يكون نفس SCAN_TOKEN الموجود في Code.gs
     *************************************************/

    const SCAN_TOKEN =
      "JAWALA-2026-CHANGE-ME-7f3a9";


    /*************************************************
     * VARIABLES
     *************************************************/

    let processing = false;

    let lastId = "";

    let lastTime = 0;


    /*************************************************
     * SOUND
     *************************************************/

    function beep(type) {

      try {

        const C =
          window.AudioContext ||
          window.webkitAudioContext;

        const ctx = new C();

        const o =
          ctx.createOscillator();

        const g =
          ctx.createGain();

        if (type === "success") {

          o.frequency.value = 880;

        } else if (type === "warn") {

          o.frequency.value = 440;

        } else {

          o.frequency.value = 220;

        }

        o.connect(g);

        g.connect(ctx.destination);

        g.gain.value = 0.08;

        o.start();

        o.stop(
          ctx.currentTime +
          (type === "success" ? 0.12 : 0.22)
        );

      } catch (e) {

        console.log("Audio error:", e);

      }

    }


    /*************************************************
     * VIBRATION
     *************************************************/

    function vibrate(ms) {

      if (navigator.vibrate) {

        navigator.vibrate(ms);

      }

    }


    /*************************************************
     * ESCAPE HTML
     *************************************************/

    function esc(s) {

      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*************************************************
     * SHOW RESULT
     *************************************************/

    function show(text, className) {

      const box =
        document.getElementById("result");

      box.className =
        className || "";

      box.innerHTML =
        text;

    }


    /*************************************************
     * SEND QR TO GOOGLE APPS SCRIPT
     *
     * يستخدم GET + JSONP
     * ومتوافق مع doGet() الموجود عندك
     *************************************************/

    function sendScan(id) {

      const callbackName =
        "cb_" + Date.now();


      /***********************************************
       * CALLBACK
       ***********************************************/

      window[callbackName] =
        function (data) {

          try {

            if (data.status === "success") {

              /*****************************************
               * SUCCESS
               *****************************************/

              beep("success");

              vibrate([100, 60, 100]);

              show(
                "✅ تم تسجيل الحضور" +
                "<br>" +
                "<b>" +
                esc(data.studentName || id) +
                "</b>" +
                "<br>" +
                "<small>الكود: " +
                esc(id) +
                "</small>",
                "success"
              );

            } else {

              /*****************************************
               * ERROR
               *****************************************/

              const msg =
                data.message ||
                "حدث خطأ غير معروف";


              if (
                msg.includes("بالفعل") ||
                msg.includes("مسجل")
              ) {

                beep("warn");

                vibrate(250);

                show(
                  "⚠️ الطالب مسجل بالفعل" +
                  "<br>" +
                  esc(msg),
                  "warn"
                );

              } else {

                beep("error");

                vibrate(400);

                show(
                  "❌ " +
                  esc(msg),
                  "error"
                );

              }

            }

          } catch (e) {

            console.error(
              "Callback error:",
              e
            );

            show(
              "❌ حدث خطأ أثناء معالجة النتيجة",
              "error"
            );

          }


          /*****************************************
           * CLEAN CALLBACK
           *****************************************/

          delete window[callbackName];


          const oldScript =
            document.getElementById(callbackName);


          if (oldScript) {

            oldScript.remove();

          }


          /*****************************************
           * READY FOR NEXT QR
           *****************************************/

          setTimeout(
            function () {

              processing = false;

              show(
                "📷 في انتظار QR...",
                ""
              );

            },
            1200
          );

        };


      /************************************************
       * CREATE SCRIPT
       ************************************************/

      const script =
        document.createElement("script");


      script.id =
        callbackName;


      /************************************************
       * BUILD REQUEST URL
       ************************************************/

      script.src =
        WEB_APP_URL +

        "?action=scan" +

        "&token=" +
        encodeURIComponent(SCAN_TOKEN) +

        "&barcode=" +
        encodeURIComponent(id) +

        "&scannedBy=" +
        encodeURIComponent("QR Scanner") +

        "&callback=" +
        encodeURIComponent(callbackName);


      /************************************************
       * CONNECTION ERROR
       ************************************************/

      script.onerror =
        function () {

          processing = false;

          beep("error");

          vibrate(400);

          show(
            "❌ فشل الاتصال بنظام الحضور",
            "error"
          );


          delete window[callbackName];


          script.remove();

        };


      /************************************************
       * SEND REQUEST
       ************************************************/

      document.body.appendChild(script);

    }


    /*************************************************
     * QR SCAN SUCCESS
     *************************************************/

    function onScanSuccess(decodedText) {

      const id =
        String(decodedText || "").trim();


      /***********************************************
       * EMPTY
       ***********************************************/

      if (!id) {

        return;

      }


      /***********************************************
       * PREVENT MULTIPLE SCANS
       ***********************************************/

      if (processing) {

        return;

      }


      /***********************************************
       * PREVENT SAME QR FOR 5 SECONDS
       ***********************************************/

      const now =
        Date.now();


      if (
        id === lastId &&
        now - lastTime < 5000
      ) {

        return;

      }


      lastId =
        id;

      lastTime =
        now;

      processing = true;


      /***********************************************
       * SHOW SCANNED VALUE
       ***********************************************/

      show(

        "🔎 تم العثور على QR" +

        "<br>" +

        "<b>" +

        esc(id) +

        "</b>" +

        "<br>" +

        "<small>جاري تسجيل الحضور...</small>",

        ""

      );


      /***********************************************
       * SEND TO SERVER
       ***********************************************/

      sendScan(id);

    }


    /*************************************************
     * QR SCAN FAILURE
     *************************************************/

    function onScanFailure(error) {

      // متعمد عدم عرض أخطاء المسح
      // لأنها بتظهر بشكل مستمر أثناء البحث عن QR

    }


    /*************************************************
     * START QR SCANNER
     *************************************************/

    const scanner =
      new Html5QrcodeScanner(

        "reader",

        {

          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          },

          rememberLastUsedCamera: true,

          supportedScanTypes: [

            Html5QrcodeScanType.SCAN_TYPE_CAMERA

          ]

        },

        false

      );


    scanner.render(
      onScanSuccess,
      onScanFailure
    );


  </script>

</body>

</html>
