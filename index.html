<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ماسح الحضور</title>
<style>
body{margin:0;background:#0f172a;color:#fff;font-family:Arial,sans-serif;text-align:center;padding:18px}
.wrap{max-width:560px;margin:auto}
.card{background:#1e293b;padding:18px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
#reader{max-width:500px;margin:auto;border-radius:12px;overflow:hidden}
#result{margin-top:16px;padding:15px;border-radius:10px;background:#172033;min-height:50px;font-size:20px;line-height:1.5}
.success{background:#064e3b!important;color:#6ee7b7}
.error{background:#450a0a!important;color:#fca5a5}
.warn{background:#451a03!important;color:#fcd34d}
.info{color:#94a3b8;margin-top:12px;font-size:14px}
button{padding:10px 18px;border:0;border-radius:8px;margin:8px;background:#2563eb;color:white;font-size:15px;cursor:pointer;transition:0.2s}
button:hover{background:#1d4ed8}
</style>
<script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
<div class="wrap">
<h1>📷 ماسح الحضور</h1>
<div class="card">
<div id="reader"></div>
<div id="result">في انتظار QR...</div>
<div class="info">امسح أكواد الطلاب واحدًا وراء الآخر.</div>
<button onclick="testConnection()">🔧 اختبار الاتصال بالسيرفر</button>
</div>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxLteTbETqw4y2pKPF7awKCbls4MbK1vPLVTjYIZHuXIXy6Mb20lhHQSkLx7TAvInUbRg/exec";
const SCAN_TOKEN = "JAWALA-2026-CHANGE-ME-7f3a9";

let processing = false, lastId = "", lastTime = 0;

function beep(type){
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    const ctx = new C(), o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = type === "success" ? 880 : type === "warn" ? 440 : 220;
    o.connect(g); g.connect(ctx.destination); g.gain.value = 0.08;
    o.start(); o.stop(ctx.currentTime + (type === "success" ? 0.12 : 0.22));
  }catch(e){}
}

function vibrate(ms){ if(navigator.vibrate) navigator.vibrate(ms); }
function esc(s){ return String(s || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m])); }
function show(t, c){ const b = document.getElementById("result"); b.className = c || ""; b.innerHTML = t; }

function sendScan(id){
  const cb = "cb_" + Date.now();
  let timer = setTimeout(() => {
    if (window[cb]) {
      delete window[cb];
      const s = document.getElementById(cb); if (s) s.remove();
      processing = false;
      show("❌ انتهت المهلة من غير رد من السيرفر<br><small>تأكد من إعدادات النشر (Deploy) والانترنت</small>", "error");
    }
  }, 12000);

  window[cb] = function(data){
    clearTimeout(timer);
    if(data.status === "success"){
      beep("success"); vibrate([100, 60, 100]);
      show("✅ تم تسجيل الحضور<br><b>" + esc(data.studentName || id) + "</b><br><small>" + esc(id) + "</small>", "success");
    }else{
      const msg = data.message || "حدث خطأ";
      if(msg.includes("بالفعل")){
        beep("warn"); vibrate(250);
        show("⚠️ الطالب مسجل بالفعل<br>" + esc(msg), "warn");
      }else{
        beep("error"); vibrate(400);
        show("❌ " + esc(msg), "error");
      }
    }
    delete window[cb]; 
    const s = document.getElementById(cb); if(s) s.remove();
    setTimeout(() => { processing = false; show("📷 في انتظار QR...", ""); }, 1500);
  };

  const s = document.createElement("script");
  s.id = cb;
  s.src = WEB_APP_URL + "?action=scan&token=" + encodeURIComponent(SCAN_TOKEN) + "&barcode=" + encodeURIComponent(id) + "&scannedBy=" + encodeURIComponent("QR Scanner") + "&callback=" + cb;
  s.onerror = function(){
    clearTimeout(timer);
    processing = false;
    show("❌ فشل الاتصال بنظام الحضور (Network Error)", "error");
    delete window[cb]; s.remove();
  };
  document.body.appendChild(s);
}

function onScanSuccess(text){
  const id = String(text || "").trim();
  if(!id || processing) return;
  const now = Date.now();
  if(id === lastId && now - lastTime < 4000) return; // تلافي المسح المكرر في 4 ثواني
  
  lastId = id; lastTime = now; processing = true;
  show("🔎 تم العثور على QR<br><b>" + esc(id) + "</b><br><small>جاري التسجيل...</small>", "");
  sendScan(id);
}

function onScanFailure(err){}

function testConnection(){
  show("⚡ جاري اختبار الاتصال...", "");
  const cb = "cb_test_" + Date.now();
  
  let timer = setTimeout(() => {
    if (window[cb]) {
      delete window[cb];
      const s = document.getElementById(cb); if (s) s.remove();
      show("❌ لم يتلق الاتصال أي رد من السيرفر.<br><small>تأكد من خيار Who has access: Anyone أثناء الـ Deploy</small>", "error");
    }
  }, 8000);

  window[cb] = function(res){
    clearTimeout(timer);
    show("✅ الاتصال شغال بنجاح ومعتمد!", "success");
    delete window[cb];
    const s = document.getElementById(cb); if(s) s.remove();
    setTimeout(() => show("📷 في انتظار QR...", ""), 2000);
  };

  const s = document.createElement("script");
  s.id = cb;
  s.src = WEB_APP_URL + "?action=scan&token=" + encodeURIComponent(SCAN_TOKEN) + "&barcode=TEST_PING&callback=" + cb;
  s.onerror = function(){
    clearTimeout(timer);
    show("❌ تعذر الوصول للرابط. تأكد من صحة الـ Web App URL", "error");
    delete window[cb]; s.remove();
  };
  document.body.appendChild(s);
}

// تهيئة السكانر بإعدادات مرنة للكاميرا
const html5QrcodeScanner = new Html5QrcodeScanner(
  "reader", 
  { 
    fps: 15, 
    qrbox: function(w, h) {
      const minEdge = Math.min(w, h);
      return { width: Math.floor(minEdge * 0.75), height: Math.floor(minEdge * 0.75) };
    },
    rememberLastUsedCamera: true,
    aspectRatio: 1.0
  }, 
  false
);

html5QrcodeScanner.render(onScanSuccess, onScanFailure);
</script>
</body>
</html>
